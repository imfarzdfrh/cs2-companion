services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: companion
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your shell or root .env}
      POSTGRES_DB: companion
    volumes: [postgres:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U companion -d companion"]
      interval: 5s
      timeout: 5s
      retries: 15
  backend:
    build: ./backend
    environment: &backend-env
      DATABASE_URL: postgresql+psycopg://companion:${POSTGRES_PASSWORD}@db:5432/companion
      FACEIT_API_KEY: ${FACEIT_API_KEY:-}
      STEAM_API_KEY: ${STEAM_API_KEY:-}
      FACEIT_WEBHOOK_SECRET: ${FACEIT_WEBHOOK_SECRET:-}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8000}
      MOBILE_URL: ${MOBILE_URL:-http://localhost:3000}
      SECURE_COOKIES: ${SECURE_COOKIES:-false}
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
  worker:
    build: ./backend
    command: [python, -m, app.workers.sync]
    environment: *backend-env
    depends_on:
      backend: {condition: service_healthy}
  mobile:
    build:
      context: .
      target: mobile
      args:
        NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE:-http://localhost:8000}
    ports: ["127.0.0.1:3000:80"]
  website:
    build:
      context: .
      target: website
      args:
        NUXT_PUBLIC_MOBILE_URL: ${NUXT_PUBLIC_MOBILE_URL:-http://localhost:3000}
    ports: ["127.0.0.1:3001:3001"]
volumes:
  postgres:
