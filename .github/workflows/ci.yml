name: Platform checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm install -g pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @cs2/mobile exec nuxt prepare && pnpm --filter @cs2/website exec nuxt prepare
      - run: pnpm typecheck && pnpm lint && pnpm test && pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: ui-check-artifacts, path: artifacts/}
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env: {POSTGRES_PASSWORD: test-only, POSTGRES_USER: companion, POSTGRES_DB: companion}
        ports: ['5432:5432']
        options: --health-cmd="pg_isready -U companion" --health-interval=5s --health-timeout=5s --health-retries=15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.lock.txt
        working-directory: backend
      - run: pytest -q
        working-directory: backend
      - run: alembic upgrade head && alembic downgrade base && alembic upgrade head
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://companion:test-only@localhost:5432/companion
