name: Android Emulator Smoke
on:
  workflow_dispatch:
  push:
    branches: [feat/ui-motion-quality-pass]
    paths:
      - 'apps/mobile/**'
      - 'scripts/android-prepare.mjs'
      - 'scripts/android-device-smoke.py'
      - '.github/workflows/android-emulator-smoke.yml'
permissions:
  contents: read
jobs:
  android-device-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install -g pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - name: Build demo-only WebView assets
        run: node scripts/android-prepare.mjs
        env:
          NUXT_PUBLIC_API_BASE: https://cs2-companion.example.invalid
          CS2_ANDROID_DEMO_ONLY: '1'
      - name: Assemble Android APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleDebug --no-daemon
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Boot emulator and test native demo
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python3 scripts/android-device-smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-android-smoke-evidence
          path: artifacts/android-emulator/
          if-no-files-found: warn
