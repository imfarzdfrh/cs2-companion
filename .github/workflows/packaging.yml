name: Nuxt and Docker packaging checks
on:
  push:
    paths:
      - 'apps/**'
      - 'backend/**'
      - 'packages/**'
      - 'Dockerfile'
      - 'compose.yaml'
      - 'deployment/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/packaging.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  docker-compose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      POSTGRES_PASSWORD: ci-only-not-a-secret
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build --wait --wait-timeout 180
      - name: Verify service responses
        run: |
          curl --fail --retry 12 --retry-all-errors --retry-delay 2 http://localhost:8000/health
          curl --fail --retry 12 --retry-all-errors --retry-delay 2 -o /dev/null http://localhost:3000/
          curl --fail --retry 12 --retry-all-errors --retry-delay 2 -o /dev/null http://localhost:3001/
      - if: failure()
        run: docker compose logs --tail=100
      - if: always()
        run: docker compose down --volumes
