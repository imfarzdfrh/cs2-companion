name: Packaging checks
on:
  push:
    paths:
      - 'apps/**'
      - 'backend/**'
      - 'packages/**'
      - 'Dockerfile'
      - 'compose.yaml'
      - 'deployment/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/packaging.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - run: npm install -g pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - name: Prepare demo-only Android bundle
        run: node scripts/android-prepare.mjs
        env:
          # Deliberately non-routable. No live backend is bundled into this demo APK.
          NUXT_PUBLIC_API_BASE: https://cs2-companion.example.invalid
      - name: Build debug APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: cs2-companion-demo-debug-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
  docker-compose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      POSTGRES_PASSWORD: ci-only-not-a-secret
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build --wait --wait-timeout 180
      - name: Verify service responses
        run: |
          curl --fail --retry 12 --retry-all-errors --retry-delay 2 http://localhost:8000/health
          curl --fail --retry 12 --retry-all-errors --retry-delay 2 -o /dev/null http://localhost:3000/
          curl --fail --retry 12 --retry-all-errors --retry-delay 2 -o /dev/null http://localhost:3001/
      - if: failure()
        run: docker compose logs --tail=100
      - if: always()
        run: docker compose down --volumes
